name: islamic_zone
description: "IslamicZone - Prayer times, Quran, Dua, Tasbih & Qibla"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Qibla direction (compass sensor)
  flutter_compass: ^0.8.1

  # Location (for prayer times & qibla)
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Quran PDF viewer
  syncfusion_flutter_pdfviewer: ^34.2.3

  # Tasbih counter persistence, saved settings
  shared_preferences: ^2.2.3

  # Prayer time calculation
  adhan: ^2.0.0

  # অ্যাপ ক্র্যাশ হলে কারণ ফাইলে লিখে রাখার জন্য
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B6E4F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26

flutter_native_splash:
  color: "#0B6E4F"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#0B6E4F"
    image: "assets/icon/splash_logo.png"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/quran.pdf
    - assets/images/
    - assets/data/
    - assets/icon/

  fonts:
    - family: Abdullah
      fonts:
        - asset: assets/fonts/abdullah.ttf
    - family: AbdullahNew
      fonts:
        - asset: assets/fonts/abdullah_new.ttf
    - family: Arabic
      fonts:
        - asset: assets/fonts/arabic.ttf
    - family: Bahij
      fonts:
        - asset: assets/fonts/bahij.ttf
    - family: ClockFont
      fonts:
        - asset: assets/fonts/clock_font.ttf
