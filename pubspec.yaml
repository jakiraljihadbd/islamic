# This file was updated by Copilot to add required dependencies for prayer times and notifications
name: islamic_zone
description: "IslamicZone - Prayer times, Quran, Dua, Tasbih & Qibla"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Qibla direction (compass sensor)
  flutter_compass: ^0.8.1

  # Location (for prayer times & qibla)
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # (APK সাইজ অপটিমাইজেশন: syncfusion_flutter_pdfviewer + বান্ডেল quran.pdf সরানো
  # হয়েছে — ৪.২MB PDF + viewer প্যাকেজ APK সাইজে অনেকখানি যোগ করছিল। কুরআন পেজ
  # আপাতত খালি রাখা হয়েছে, দেখুন lib/screens/quran_reader_screen.dart)

  # Tasbih counter persistence, saved settings
  shared_preferences: ^2.2.3

  # Prayer time calculation (fallback)
  adhan: ^2.0.0

  # HTTP client for Aladhan API
  http: ^1.2.0

  # Local notifications / alarm scheduling
  flutter_local_notifications: ^18.0.1

  # Background alarm firing (actually wakes the app to play azan at prayer time)
  android_alarm_manager_plus: ^4.0.4

  # Audio playback for azan mp3
  just_audio: ^0.9.33

  # Timezone support for scheduled notifications
  timezone: ^0.9.0

  # Internationalization / formatting
  intl: ^0.19.0

  # Optional: Google fonts (for Bengali if desired)
  google_fonts: ^5.0.0

  # অ্যাপ ক্র্যাশ হলে কারণ ফাইলে লিখে রাখার জন্য
  path_provider: ^2.1.4

  # alarm reliability: ফোনের ব্র্যান্ড/ম্যানুফ্যাকচারার শনাক্ত করার জন্য (Xiaomi,
  # Oppo, Vivo, Huawei ইত্যাদি প্রতিটার নিজস্ব "autostart" সেটিংস আলাদা জায়গায়)
  device_info_plus: ^11.2.0

  # alarm reliability: OEM-specific autostart/background-permission settings
  # স্ক্রিনে সরাসরি নিয়ে যাওয়ার জন্য (এগুলো standard Android settings action
  # দিয়ে খোলা যায় না, প্রতিটা manufacturer এর নিজস্ব activity লাগে)
  android_intent_plus: ^5.2.0

  # lat/lng থেকে জেলা/শহরের নাম বের করার জন্য (10.2, বিসমিল্লাহ ফ্রেমে লোকেশন দেখাতে)
  geocoding: ^3.0.0

  # splash fix: preserve()/remove() রানটাইম API লাগে (শুধু icon/splash asset
  # জেনারেট করার build-time টুল হিসেবে না — তাই dev_dependencies থেকে সরিয়ে
  # এখানে আনা হয়েছে, নাহলে lib/main.dart এ import করলে build fail করত)
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B6E4F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26

flutter_native_splash:
  color: "#0B6E4F"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#0B6E4F"
    image: "assets/icon/splash_logo.png"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # 10.1 ফিক্স: Flutter-এ folder asset entry শুধু ওই ফোল্ডারের সরাসরি ভেতরের ফাইল
    # bundle করে, sub-folder recursive না — তাই আগে "assets/images/" একাই লেখা থাকায়
    # নিচের সাব-ফোল্ডারের ইমেজ/আইকনগুলো আসলে build-এ কখনো যুক্তই হতো না (রানটাইমে
    # errorBuilder ফলব্যাকে চলে যেত বা কিছু শো করত না)। প্রতিটা সাব-ফোল্ডার এখন আলাদাভাবে
    # লিস্ট করা হলো। নতুন সাব-ফোল্ডার যোগ হলে এখানেও লাইন যোগ করতে হবে।
    - assets/images/flower/
    - assets/images/menu/
    - assets/images/nav/
    - assets/images/qibla/
    - assets/images/prayer_scenes/
    - assets/data/
    - assets/icon/
    - assets/azan.mp3

  fonts:
    - family: Abdullah
      fonts:
        - asset: assets/fonts/abdullah.ttf
    - family: AbdullahNew
      fonts:
        - asset: assets/fonts/abdullah_new.ttf
    - family: Arabic
      fonts:
        - asset: assets/fonts/arabic.ttf
    - family: Bahij
      fonts:
        - asset: assets/fonts/bahij.ttf
    - family: ClockFont
      fonts:
        - asset: assets/fonts/clock_font.ttf
