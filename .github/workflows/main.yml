name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Ensure android/ platform folder exists
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.islamiczone --project-name islamic_zone .
          fi

      - name: Set application id to match original app
        run: |
          BUILD_GRADLE="android/app/build.gradle.kts"
          if [ ! -f "$BUILD_GRADLE" ]; then BUILD_GRADLE="android/app/build.gradle"; fi
          sed -i 's/com\.islamiczone\.islamic_zone/com.islamiczone.org/g' "$BUILD_GRADLE"
          sed -i 's/com\.islamiczone\.islamic_zone/com.islamiczone.org/g' android/app/src/main/AndroidManifest.xml || true

      - name: Add required permissions (location, vibrate, notifications)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.INTERNET" \
            "android.permission.ACCESS_FINE_LOCATION" \
            "android.permission.ACCESS_COARSE_LOCATION" \
            "android.permission.VIBRATE" \
            "android.permission.RECEIVE_BOOT_COMPLETED" \
            "android.permission.POST_NOTIFICATIONS"; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "0,/<manifest[^>]*>/s//&\n    <uses-permission android:name=\"$PERM\"\/>/" "$MANIFEST"
            fi
          done
          cat "$MANIFEST"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: islamic-zone-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
